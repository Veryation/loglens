name: Bug report
description: Something in LogLens isn't working right.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please remove any sensitive data (credentials, PII, private log contents) from anything you paste below.
  - type: dropdown
    id: product
    attributes:
      label: Which LogLens?
      options:
        - JetBrains IDEs (IntelliJ, PyCharm, WebStorm, GoLand, Rider, …)
        - VS Code / Cursor / Windsurf / VSCodium
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Free or Pro?
      description: Pro features include cross-file merge, SQL queries, JSON querying, capture columns, the error-density timeline, tail alerts, bookmarks, highlight rules, saved views and redaction.
      options:
        - Free
        - Pro
        - Not sure
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor & version
      placeholder: e.g. IntelliJ IDEA 2025.2, or VS Code 1.129
    validations:
      required: true
  - type: input
    id: loglens-version
    attributes:
      label: LogLens version
      description: Settings → Plugins → LogLens (JetBrains), or the Extensions view (VS Code).
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 14, Ubuntu 24.04
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a .log file of ~X GB
        2. ...
        3. ...
  - type: input
    id: file-size
    attributes:
      label: Log file size
      description: Most LogLens bugs depend on scale, so this genuinely helps.
      placeholder: e.g. 40 MB, 2 GB, still being written to
  - type: dropdown
    id: format
    attributes:
      label: Log format
      options:
        - Plain text
        - JSON (one object per line)
        - Mixed
        - Other / not sure
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: |
        Screenshots help a lot. A few **redacted** sample lines showing the format are ideal.
        If the IDE reported an error, the stack trace from Help → Show Log in Explorer (JetBrains)
        or Help → Toggle Developer Tools → Console (VS Code) is very useful.
